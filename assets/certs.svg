  <rect x="14" y="60" width="242" height="1" fill="#e2e8f0"/>
  <text x="14" y="78" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="10.5" fill="#16a34a">✓ Verified Credential</text>
  <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Database Modeling &amp; Queries</text>
