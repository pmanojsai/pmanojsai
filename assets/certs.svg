<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Certifications &amp; Credentials">
<!-- Container -->
<rect width="1200" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

<!-- Header -->
<rect width="1200" height="34" rx="10" fill="#f8fafc"/>
<rect x="0" y="33" width="1200" height="1" fill="#e2e8f0"/>
<text x="24" y="21" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a">VERIFIED CREDENTIALS &amp; ACADEMIC RECOGNITION</text>

<!-- 4 Cards -->
<!-- Card 1: AWS Cloud Practitioner -->
<g transform="translate(24, 48)">
  <rect width="270" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="28" cy="30" r="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="28" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#d97706">AWS</text>
  <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Cloud Practitioner</text>
  <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b">Amazon Web Services</text>
  <rect x="14" y="60" width="242" height="1" fill="#e2e8f0"/>
  <text x="14" y="78" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="10.5" fill="#0969da">✓ Verified Certificate</text>
  <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Issued: Oct 2024</text>
</g>

<!-- Card 2: AWS Solutions Architect -->
