  <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Agentforce Specialist</text>
  <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b">Salesforce</text>
  <rect x="14" y="60" width="254" height="1" fill="#e2e8f0"/>
  <text x="14" y="78" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="10.5" fill="#0284c7">✓ AI Agent Architecture</text>
  <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Issued: 2025</text>
</g>

<!-- Recognition Pill Strip -->
<g transform="translate(24, 172)">
  <!-- Pill 1: Patent -->
  <g transform="translate(0, 0)">
    <rect width="365" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#8250df"/>
    <text x="30" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Provisional Patent Filed · Ojas Raksha (2025)</text>
  </g>
  <!-- Pill 2: Paper -->
  <g transform="translate(380, 0)">
    <rect width="365" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#0969da"/>
    <text x="30" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Research Paper Under Review (2026)</text>
  </g>
  <!-- Pill 3: IEEE Award -->
  <g transform="translate(760, 0)">
    <rect width="392" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#16a34a"/>
    <text x="30" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">IEEE Student Branch Belt Performer Award</text>
