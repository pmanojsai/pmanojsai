<rect width="1200" height="330" rx="20" fill="url(#certs-bg)" stroke="#cbd5e1" stroke-width="1.5"/>

<!-- Card 1: AWS Cloud Practitioner -->
<g transform="translate(45,30)" filter="url(#cert-sh)">
