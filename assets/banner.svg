    <text x="36" y="26" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#0f172a" clip-path="url(#typ2)">cloud: ["AWS KMS", "S3", "Lambda", "Docker", "CI/CD"]</text>
