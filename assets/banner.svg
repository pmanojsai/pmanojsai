  </circle>
  <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">Available for Roles &amp; Internships</text>
</g>

<!-- Name -->
<text x="48" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#name-grad)" letter-spacing="-0.5">Puneeth Manoj Sai</text>

<!-- Title & Bio -->
<text x="48" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#0969da">Front-End &amp; Full Stack Software Engineer</text>
<text x="48" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569">KL University '27 · Computer Science &amp; Information Technology</text>
<text x="48" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">Specialized in high-performance web systems, cloud infrastructure &amp; Web3.</text>

