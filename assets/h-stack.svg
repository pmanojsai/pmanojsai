<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Tech Stack">
<defs>
  <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f8fafc"/>
  </linearGradient>
  <linearGradient id="h-laser" x1="0" x2="1">
    <stop offset="0" stop-color="#d97706" stop-opacity="0"/>
    <stop offset=".5" stop-color="#d97706"/>
    <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
  </linearGradient>
  <filter id="h-shadow" x="-5%" y="-10%" width="110%" height="130%">
    <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
  </filter>
</defs>
<rect width="1200" height="96" rx="16" fill="url(#h-bg)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#h-shadow)"/>
<rect x="28" y="24" width="6" height="48" rx="3" fill="#d97706">
  <animate attributeName="opacity" values="1;.5;1" dur="3s" repeatCount="indefinite"/>
</rect>
<text x="52" y="46" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#d97706" letter-spacing="2">04 /</text>
<text x="52" y="76" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="900" fill="#0f172a">Tech Stack</text>
<text x="1172" y="58" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#64748b">What I build with</text>
<rect x="0" y="93" width="1200" height="3" fill="#e2e8f0"/>
<rect x="-300" y="93" width="300" height="3" fill="url(#h-laser)">
  <animate attributeName="x" values="-300;1200" dur="4.0s" repeatCount="indefinite"/>
</rect>
</svg>