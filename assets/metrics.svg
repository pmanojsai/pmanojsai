<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Key Impact Metrics">
<defs>
  <filter id="kpi-sh" x="0" y="0" width="100%" height="100%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
  </filter>
</defs>

<!-- Card 1: Users Scaled -->
<g transform="translate(0, 0)">
  <rect width="285" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#kpi-sh)"/>
  <rect x="0" y="0" width="4" height="96" rx="2" fill="#0969da"/>
  <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.5">800+</text>
  <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Concurrent Users Scaled</text>
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">IEEE Summit Platform</text>
</g>

<!-- Card 2: Performance Boost -->
<g transform="translate(305, 0)">
  <rect width="285" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#kpi-sh)"/>
  <rect x="0" y="0" width="4" height="96" rx="2" fill="#16a34a"/>
  <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.5">50%</text>
  <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Faster Page Load</text>
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Bundle splitting &amp; CI/CD</text>
</g>

<!-- Card 3: Role Dashboards -->
<g transform="translate(610, 0)">
  <rect width="285" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#kpi-sh)"/>
  <rect x="0" y="0" width="4" height="96" rx="2" fill="#8250df"/>
  <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.5">10+</text>
  <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Granular Role Dashboards</text>
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Ojas Raksha Architecture</text>
</g>

<!-- Card 4: Credentials & Patents -->
<g transform="translate(915, 0)">
  <rect width="285" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#kpi-sh)"/>
  <rect x="0" y="0" width="4" height="96" rx="2" fill="#d97706"/>
  <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.5">4x</text>
  <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Certifications &amp; Patents</text>
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">AWS, Mongo, Salesforce &amp; Patent</text>
</g>
</svg>