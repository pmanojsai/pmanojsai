<g transform="translate(910,270)" filter="url(#ojas-sh)">
  <rect width="250" height="86" rx="14" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
  <rect width="6" height="86" rx="3" fill="#db2777"/>
