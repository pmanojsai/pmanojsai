<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Ojas Raksha System Architecture">
<defs>
  <filter id="arch-sh" x="0" y="0" width="100%" height="100%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
  </filter>
  <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 8 5 L 0 9 z" fill="#0969da"/>
  </marker>
</defs>

<!-- Pure White Clean Canvas -->
<rect width="1200" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

<!-- Header bar -->
<rect width="1200" height="36" rx="10" fill="#f8fafc"/>
<rect x="0" y="35" width="1200" height="1" fill="#e2e8f0"/>
<circle cx="20" cy="18" r="4" fill="#8250df"/>
<text x="32" y="22" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a">Ojas Raksha · Decentralized Health Architecture (Patent Filed 2025)</text>

<!-- Flow Connection Lines with Animated Signal Pulses -->
<line x1="260" y1="135" x2="355" y2="135" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
<circle cx="300" cy="135" r="3" fill="#0969da">
  <animate attributeName="cx" values="265;350" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
</circle>

<line x1="560" y1="135" x2="655" y2="135" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
<circle cx="600" cy="135" r="3" fill="#0969da">
  <animate attributeName="cx" values="565;650" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
</circle>

<line x1="860" y1="135" x2="955" y2="135" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
<circle cx="900" cy="135" r="3" fill="#0969da">
  <animate attributeName="cx" values="865;950" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
</circle>

<!-- Block 1: Client Tier -->
<g transform="translate(40, 60)" filter="url(#arch-sh)">
  <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="220" height="30" rx="8" fill="#f8fafc"/>
  <rect x="0" y="29" width="220" height="1" fill="#e2e8f0"/>
  <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. Client &amp; Role Portals</text>
  
  <text x="14" y="55" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#0969da">React · Next.js · Ethers</text>
  <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• 10+ Granular Role Portals</text>
  <text x="14" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• Patient Consent Management</text>
  <text x="14" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• MetaMask Web3 Signer</text>
  <text x="14" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#16a34a" font-weight="600">✓ Zero-Knowledge Auth</text>
</g>

<!-- Block 2: Cloud & KMS Tier -->
<g transform="translate(340, 60)" filter="url(#arch-sh)">
  <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="220" height="30" rx="8" fill="#f8fafc"/>
  <rect x="0" y="29" width="220" height="1" fill="#e2e8f0"/>
  <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2. Security &amp; AWS KMS</text>
  
  <text x="14" y="55" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#d97706">AWS KMS · AES-256-GCM</text>
  <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• Envelope Encryption</text>
  <text x="14" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• Dynamic DEK Generation</text>
  <text x="14" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• Microservice Gateway</text>
  <text x="14" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#16a34a" font-weight="600">✓ Cryptographic Privacy</text>
</g>

<!-- Block 3: Decentralized Storage -->
<g transform="translate(640, 60)" filter="url(#arch-sh)">
  <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="220" height="30" rx="8" fill="#f8fafc"/>
  <rect x="0" y="29" width="220" height="1" fill="#e2e8f0"/>
  <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">3. Decentralized Storage</text>
  
  <text x="14" y="55" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#0284c7">IPFS · Content Addressing</text>
  <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• Encrypted Health Records</text>
  <text x="14" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• Deterministic CIDs</text>
  <text x="14" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• Pinning &amp; Replication</text>
  <text x="14" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#16a34a" font-weight="600">✓ Tamper-Proof Storage</text>
</g>

<!-- Block 4: Smart Contracts -->
<g transform="translate(940, 60)" filter="url(#arch-sh)">
  <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="0" width="220" height="30" rx="8" fill="#f8fafc"/>
  <rect x="0" y="29" width="220" height="1" fill="#e2e8f0"/>
  <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">4. Blockchain Layer</text>
  
  <text x="14" y="55" font-family="'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#8250df">Solidity · EVM / Algorand</text>
  <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• grantConsent() Logic</text>
  <text x="14" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• revokeConsent() Control</text>
  <text x="14" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">• Immutable Audit Trail</text>
  <text x="14" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#16a34a" font-weight="600">✓ Non-Repudiation</text>
</g>
</svg>